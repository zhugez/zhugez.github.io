name: Validate SvelteKit Worker

on:
  push:
    branches: [main, svelte-migration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run deploy:check
